name: Go Build and Release

on:
  push:
    tags:
      - '*.*.*' # Triggers only on version tags like 1.0.0

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Build binaries
      run: |
        mkdir -p dist
        # Build the standard binary (no special build tags)
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o dist/wsnet_go_${{ matrix.goos }}_${{ matrix.goarch }}

        # Build the Tailscale **server** variant (tag: tailscale)
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -tags tailscale -o dist/wsnet_go_tailscale_${{ matrix.goos }}_${{ matrix.goarch }}

        # Build the Tailscale **client** variant (tags: tailscale tailscaleclient)
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -tags "tailscale tailscaleclient" -o dist/wsnet_go_tailscale_client_${{ matrix.goos }}_${{ matrix.goarch }}

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: wsnet_go_${{ matrix.goos }}_${{ matrix.goarch }}
        path: dist/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all binaries
      uses: actions/download-artifact@v4
      with:
        path: dist/
        merge-multiple: true

    - name: Upload wsnet binaries to R2 (production)
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        npx wrangler r2 object put "octopwn-core/wsnet.exe" --file="dist/wsnet_go_windows_amd64" --remote
        npx wrangler r2 object put "octopwn-core/wsnet_tailscale.exe" --file="dist/wsnet_go_tailscale_windows_amd64" --remote
        npx wrangler r2 object put "octopwn-core/wsnet_Readme.md" --file="README.md" --remote

    - name: Upload wsnet-go source zip to R2 (production)
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        zip -r wsnet_golang.zip . -x ".git/*" "dist/*"
        npx wrangler r2 object put "octopwn-core/wsnet/wsnet_golang.zip" --file="wsnet_golang.zip" --remote

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
